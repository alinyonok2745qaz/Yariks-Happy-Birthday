<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём Рождения!</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Comfortaa & Marck Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Marck+Script&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Comfortaa', cursive, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-greeting {
      font-family: 'Marck Script', cursive;
    }

    /* Анимированный фоновый градиент */
    .bg-gradient-animated {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Анимации плавности */
    .fade-enter {
      opacity: 0;
      transform: scale(0.8) translateY(20px);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .fade-enter-active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .fade-exit {
      opacity: 1;
      transform: scale(1) translateY(0);
      transition: all 0.4s ease-in;
    }

    .fade-exit-active {
      opacity: 0;
      transform: scale(0.8) translateY(-20px);
      pointer-events: none;
    }

    /* Пульсация сердечка */
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.12); }
      28% { transform: scale(1); }
      42% { transform: scale(1.12); }
      70% { transform: scale(1); }
    }

    .pulse-heart {
      animation: heartbeat 1.5s infinite;
    }

    /* Потряхивание при клике на сердечко */
    .shake-heart {
      animation: heartShake 0.25s ease-in-out;
    }

    @keyframes heartShake {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.15) rotate(-10deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      75% { transform: scale(1.15) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Анимация пламени свечи */
    @keyframes flicker {
      0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
      20% { transform: scale(1.1, 1.2) rotate(2deg); opacity: 1; }
      40% { transform: scale(0.95, 0.9) rotate(-1deg); opacity: 0.85; }
      60% { transform: scale(1.05, 1.1) rotate(3deg); opacity: 1; }
      80% { transform: scale(0.98, 1.05) rotate(-2deg); opacity: 0.9; }
    }

    .flame-anim {
      animation: flicker 1.2s infinite ease-in-out;
      transform-origin: center bottom;
    }

    /* Кастомный канвас для фона */
    #bgCanvas, #fxCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #bgCanvas { z-index: 1; }
    #fxCanvas { z-index: 30; }

    /* Облачко с текстом для котика */
    .speech-bubble {
      position: relative;
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 12px 24px;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.25);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    /* Стильная кнопка */
    .btn-gradient {
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 50%, #ff4757 100%);
      box-shadow: 0 10px 25px -5px rgba(255, 71, 87, 0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-gradient:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 30px -5px rgba(255, 71, 87, 0.6);
    }

    .btn-gradient:active {
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>
<body class="bg-gradient-animated min-h-screen w-screen flex flex-col items-center justify-center relative overflow-hidden text-gray-800">

  <!-- Фоновый холст для летающих сердечек и конфетти -->
  <canvas id="bgCanvas"></canvas>
  <!-- Верхний холст для эффектов взрыва / частичек -->
  <canvas id="fxCanvas"></canvas>

  <main class="relative z-10 w-full max-w-lg px-4 flex flex-col items-center justify-center min-h-screen">

    <!-- ШАГ 1: Котик + Речевое облако + Кнопка "Дальше" -->
    <div id="step1" class="step-container flex flex-col items-center justify-center text-center w-full transition-all duration-500">
      
      <!-- Речевое облачко -->
      <div class="speech-bubble mb-6 animate-bounce">
        <p class="text-xl md:text-2xl font-bold text-pink-600">Жми на кнопку! ✨</p>
      </div>

      <!-- Векторный милый котёнок -->
      <div class="w-64 h-64 md:w-72 md:h-72 mb-8 filter drop-shadow-xl transition-transform hover:scale-105 duration-300">
        <svg viewBox="0 0 200 200" class="w-full h-full">
          <!-- Ушки -->
          <path d="M 45 75 L 25 25 L 75 45 Z" fill="#FFB6C1" stroke="#FF69B4" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 50 70 L 35 35 L 70 50 Z" fill="#FFC0CB" />
          <path d="M 155 75 L 175 25 L 125 45 Z" fill="#FFB6C1" stroke="#FF69B4" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 150 70 L 165 35 L 130 50 Z" fill="#FFC0CB" />
          
          <!-- Голова -->
          <ellipse cx="100" cy="95" rx="65" ry="55" fill="#FFF5F5" stroke="#FF69B4" stroke-width="3"/>
          
          <!-- Пятнышки / детали -->
          <path d="M 85 42 Q 100 50 115 42" fill="none" stroke="#FFB6C1" stroke-width="4" stroke-linecap="round"/>
          
          <!-- Глаза -->
          <ellipse cx="75" cy="90" rx="9" ry="12" fill="#2D3748"/>
          <ellipse cx="125" cy="90" rx="9" ry="12" fill="#2D3748"/>
          <!-- Блики в глазах -->
          <circle cx="72" cy="86" r="3.5" fill="#FFFFFF"/>
          <circle cx="77" cy="92" r="1.5" fill="#FFFFFF"/>
          <circle cx="122" cy="86" r="3.5" fill="#FFFFFF"/>
          <circle cx="127" cy="92" r="1.5" fill="#FFFFFF"/>
          
          <!-- Щёчки -->
          <ellipse cx="60" cy="102" rx="10" ry="6" fill="#FF8DA1" opacity="0.6"/>
          <ellipse cx="140" cy="102" rx="10" ry="6" fill="#FF8DA1" opacity="0.6"/>
          
          <!-- Носик и ротик -->
          <polygon points="96,98 104,98 100,103" fill="#FF6B81"/>
          <path d="M 94 105 Q 100 112 100 106 Q 100 112 106 105" fill="none" stroke="#FF6B81" stroke-width="2.5" stroke-linecap="round"/>
          
          <!-- Усики -->
          <path d="M 45 90 L 20 86 M 42 97 L 18 97 M 45 104 L 22 108" stroke="#FFB6C1" stroke-width="2" stroke-linecap="round"/>
          <path d="M 155 90 L 180 86 M 158 97 L 182 97 M 155 104 L 178 108" stroke="#FFB6C1" stroke-width="2" stroke-linecap="round"/>
          
          <!-- Лапки держат сердечко -->
          <path d="M 60 140 Q 60 120 80 125" fill="none" stroke="#FFF5F5" stroke-width="16" stroke-linecap="round"/>
          <path d="M 140 140 Q 140 120 120 125" fill="none" stroke="#FFF5F5" stroke-width="16" stroke-linecap="round"/>
          <path d="M 60 140 Q 60 120 80 125" fill="none" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
          <path d="M 140 140 Q 140 120 120 125" fill="none" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
          
          <!-- Маленькое сердечко в лапках -->
          <path d="M 100 135 C 100 135 85 120 85 110 C 85 102 92 98 100 106 C 108 98 115 102 115 110 C 115 120 100 135 100 135 Z" fill="#FF4757"/>
        </svg>
      </div>

      <!-- Кнопка "Дальше" -->
      <button id="btnNext" class="btn-gradient text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-full cursor-pointer tracking-wide transform transition hover:scale-105 active:scale-95 shadow-lg">
        Дальше <i class="fa-solid fa-arrow-right ml-2"></i>
      </button>
    </div>


    <!-- ШАГ 2: Интерактивное сердечко (10 кликов) -->
    <div id="step2" class="step-container hidden flex-col items-center justify-center text-center w-full transition-all duration-500">
      
      <div class="mb-4 bg-white/80 backdrop-blur-sm px-6 py-3 rounded-full shadow-md border border-pink-200">
        <p class="text-lg md:text-xl font-bold text-pink-600">
          Нажми на сердечко <span id="clicksLeft" class="text-2xl text-red-500 font-extrabold px-1">10</span> раз!
        </p>
      </div>

      <!-- Сердечко для кликов -->
      <div id="interactiveHeart" class="cursor-pointer my-8 pulse-heart transition-transform duration-100 select-none">
        <svg viewBox="0 0 100 100" class="w-48 h-48 md:w-56 md:h-56 filter drop-shadow-2xl">
          <defs>
            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff4757" />
              <stop offset="50%" stop-color="#ff6b81" />
              <stop offset="100%" stop-color="#ed225d" />
            </linearGradient>
          </defs>
          <path d="M 50 88 C 20 60 5 40 5 25 C 5 10 18 2 32 2 C 41 2 47 7 50 12 C 53 7 59 2 68 2 C 82 2 95 10 95 25 C 95 40 80 60 50 88 Z" fill="url(#heartGrad)" />
          <!-- Блик -->
          <path d="M 22 16 C 14 24 14 34 14 34" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
        </svg>
      </div>

      <p class="text-sm text-pink-700/80 font-medium">Кликай активнее! 💕</p>
    </div>


    <!-- ШАГ 3: Торт со свечкой и цифрой 19 -->
    <div id="step3" class="step-container hidden flex-col items-center justify-center text-center w-full transition-all duration-500">
      
      <div class="mb-6 bg-white/80 backdrop-blur-sm px-6 py-3 rounded-full shadow-md border border-pink-200">
        <p class="text-lg md:text-xl font-bold text-pink-600 animate-pulse">
          ✨ Нажми на свечку, чтобы задуть её! ✨
        </p>
      </div>

      <!-- Контейнер торта -->
      <div class="relative my-4 cursor-pointer group" id="cakeContainer">
        <svg viewBox="0 0 240 220" class="w-64 h-64 md:w-72 md:h-72 filter drop-shadow-2xl">
          <!-- Подставка / Тарелка -->
          <ellipse cx="120" cy="195" rx="100" ry="18" fill="#E2E8F0"/>
          <ellipse cx="120" cy="192" rx="95" ry="15" fill="#FFFFFF"/>

          <!-- Нижний ярус торта -->
          <path d="M 40 140 L 40 180 Q 120 205 200 180 L 200 140 Z" fill="#FF8DA1"/>
          <ellipse cx="120" cy="140" rx="80" ry="18" fill="#FFAABC"/>
          <!-- Потёки глазури нижнего яруса -->
          <path d="M 40 140 Q 50 160 60 140 Q 75 165 90 140 Q 110 168 130 140 Q 150 162 170 140 Q 185 160 200 140 Q 200 150 200 140 L 200 140 L 40 140 Z" fill="#FFF0F5"/>

          <!-- Верхний ярус торта -->
          <path d="M 60 100 L 60 135 Q 120 155 180 135 L 180 100 Z" fill="#FF6B81"/>
          <ellipse cx="120" cy="100" rx="60" ry="14" fill="#FF8DA1"/>
          <!-- Потёки глазури верхнего яруса -->
          <path d="M 60 100 Q 75 118 90 100 Q 110 122 130 100 Q 150 118 165 100 Q 180 115 180 100 L 60 100 Z" fill="#FFFFFF"/>

          <!-- Крем и ягодки -->
          <circle cx="70" cy="100" r="5" fill="#FF4757"/>
          <circle cx="95" cy="103" r="5" fill="#FF4757"/>
          <circle cx="120" cy="105" r="5" fill="#FF4757"/>
          <circle cx="145" cy="103" r="5" fill="#FF4757"/>
          <circle cx="170" cy="100" r="5" fill="#FF4757"/>

          <!-- Цифра 19 на торте -->
          <text x="120" y="150" font-family="'Comfortaa', cursive" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle" opacity="0.95" drop-shadow="0 2px 4px rgba(0,0,0,0.2)">19</text>

          <!-- Свечка -->
          <rect x="115" y="55" width="10" height="38" rx="3" fill="url(#candleGrad)"/>
          <!-- Полоски на свечке -->
          <path d="M 115 62 L 125 67 M 115 72 L 125 77 M 115 82 L 125 87" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Фитиль -->
          <line x1="120" y1="55" x2="120" y2="48" stroke="#4A5568" stroke-width="2"/>

          <defs>
            <linearGradient id="candleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#38BDF8" />
              <stop offset="100%" stop-color="#818CF8" />
            </linearGradient>
            <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFE600" stop-opacity="1"/>
              <stop offset="50%" stop-color="#FF7700" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#FF0000" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- Огонек свечи (с сиянием) -->
          <g id="candleFlame" class="flame-anim">
            <!-- Ореол свечения -->
            <circle cx="120" cy="35" r="22" fill="url(#flameGlow)" />
            <!-- Внешнее пламя -->
            <path d="M 120 20 C 113 32 112 38 120 46 C 128 38 127 32 120 20 Z" fill="#FF9F43"/>
            <!-- Внутреннее пламя -->
            <path d="M 120 27 C 116 34 116 38 120 44 C 124 38 124 34 120 27 Z" fill="#FECA57"/>
            <!-- Сердцевина пламени -->
            <ellipse cx="120" cy="40" rx="2" ry="4" fill="#FFFFFF"/>
          </g>
        </svg>
      </div>

    </div>


    <!-- ШАГ 4: Поздравление + Кнопка "К началу" -->
    <div id="step4" class="step-container hidden flex-col items-center justify-center text-center w-full transition-all duration-700">
      
      <!-- Карточка с душевным текстом -->
      <div class="bg-white/85 backdrop-blur-md p-8 md:p-10 rounded-3xl shadow-2xl border-2 border-pink-200 transform transition hover:scale-[1.01] duration-300 max-w-md">
        
        <div class="text-4xl mb-4 animate-bounce">💖</div>
        
        <h1 class="font-greeting text-3xl md:text-4xl font-bold text-pink-600 leading-relaxed tracking-wide mb-4">
          С днём рождения, моё драгоценное солнце!
        </h1>
        
        <p class="font-greeting text-2xl md:text-3xl text-red-500 font-semibold leading-relaxed">
          Люблю тебя всем сердцем и душой!
        </p>

        <div class="mt-6 flex justify-center space-x-2 text-pink-400">
          <i class="fa-solid fa-heart animate-pulse"></i>
          <i class="fa-solid fa-star animate-pulse delay-100"></i>
          <i class="fa-solid fa-heart animate-pulse delay-200"></i>
        </div>
      </div>

      <!-- Маленькая кнопочка "К началу" -->
      <button id="btnRestart" class="mt-10 bg-white/70 hover:bg-white text-pink-600 hover:text-pink-700 font-semibold py-2 px-6 rounded-full text-sm shadow-md transition-all duration-300 border border-pink-200 hover:shadow-lg flex items-center space-x-2">
        <i class="fa-solid fa-rotate-left"></i>
        <span>К началу</span>
      </button>

    </div>

  </main>

  <script>
    // --- ИНИЦИАЛИЗАЦИЯ СОСТОЯНИЙ И ПЕРЕМЕННЫХ ---
    let currentStep = 1;
    let clicksRemaining = 10;
    
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const step4 = document.getElementById('step4');
    
    const btnNext = document.getElementById('btnNext');
    const interactiveHeart = document.getElementById('interactiveHeart');
    const clicksLeftEl = document.getElementById('clicksLeft');
    const cakeContainer = document.getElementById('cakeContainer');
    const candleFlame = document.getElementById('candleFlame');
    const btnRestart = document.getElementById('btnRestart');

    // --- НАСТРОЙКА КАНВАСА ФОНА И ЭФФЕКТОВ ---
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fxCanvas');
    const fxCtx = fxCanvas.getContext('2d');

    let width, height;

    function resizeCanvas() {
      width = bgCanvas.width = fxCanvas.width = window.innerWidth;
      height = bgCanvas.height = fxCanvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Летающие сердечки на фоне
    const floatingHearts = [];
    const heartCount = 25;

    for (let i = 0; i < heartCount; i++) {
      floatingHearts.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 18 + 10,
        speedY: Math.random() * 0.8 + 0.3,
        speedX: Math.sin(Math.random() * Math.PI) * 0.5,
        opacity: Math.random() * 0.5 + 0.3,
        swing: Math.random() * 2,
        swingSpeed: Math.random() * 0.02 + 0.01
      });
    }

    // Конфетти
    const confettiList = [];
    const confettiColors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#3742fa', '#ed225d', '#ffffff'];

    for (let i = 0; i < 40; i++) {
      confettiList.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 6 + 4,
        d: Math.random() * heartCount,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        tilt: Math.floor(Math.random() * 10) - 10,
        tiltAngleIncremental: Math.random() * 0.07 + 0.05,
        tiltAngle: 0
      });
    }

    // Отрисовка формы сердечка на канвасе
    function drawHeart(ctx, x, y, size, color, opacity) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      // Верхняя левая кривая
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      // Нижняя левая кривая
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + size, x, y + size);
      // Нижняя правая кривая
      ctx.bezierCurveTo(x, y + size, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      // Верхняя правая кривая
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Анимационный цикл постоянного фона
    function renderBackground() {
      bgCtx.clearRect(0, 0, width, height);

      // Анимация плавающих сердечек
      floatingHearts.forEach(h => {
        h.y -= h.speedY;
        h.swing += h.swingSpeed;
        h.x += Math.sin(h.swing) * 0.5;

        if (h.y < -30) {
          h.y = height + 20;
          h.x = Math.random() * width;
        }

        drawHeart(bgCtx, h.x, h.y, h.size, '#ff6b81', h.opacity);
      });

      // Анимация конфетти
      confettiList.forEach((c, index) => {
        c.tiltAngle += c.tiltAngleIncremental;
        c.y += (Math.cos(c.d) + 1 + c.r / 2) * 0.5;
        c.x += Math.sin(c.d);

        if (c.y > height) {
          c.y = -20;
          c.x = Math.random() * width;
        }

        bgCtx.beginPath();
        bgCtx.lineWidth = c.r;
        bgCtx.strokeStyle = c.color;
        bgCtx.moveTo(c.x + c.tilt + c.r / 2, c.y);
        bgCtx.lineTo(c.x + c.tilt, c.y + c.tilt + c.r / 2);
        bgCtx.stroke();
      });

      requestAnimationFrame(renderBackground);
    }

    renderBackground();


    // --- АНИМАЦИИ ВЗРЫВА И ВЫЛЕТАЮЩИХ ЧАСТИЦ (FX Canvas) ---
    let particles = [];

    function createBurst(x, y, count = 30, isHeart = false) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (isHeart ? 2 : 0),
          size: Math.random() * 12 + 6,
          color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
          alpha: 1,
          decay: Math.random() * 0.03 + 0.015,
          isHeart: isHeart
        });
      }
    }

    function renderParticles() {
      fxCtx.clearRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // гравитация
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        if (p.isHeart) {
          drawHeart(fxCtx, p.x, p.y, p.size, p.color, p.alpha);
        } else {
          fxCtx.save();
          fxCtx.globalAlpha = p.alpha;
          fxCtx.fillStyle = p.color;
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.restore();
        }
      }

      requestAnimationFrame(renderParticles);
    }

    renderParticles();


    // --- УПРАВЛЕНИЕ ШАГАМИ СЦЕНАРИЯ ---

    function transitionSteps(fromStep, toStep) {
      fromStep.classList.add('fade-exit');
      
      setTimeout(() => {
        fromStep.classList.add('hidden');
        fromStep.classList.remove('fade-exit');
        
        toStep.classList.remove('hidden');
        toStep.classList.add('fade-enter');
        
        setTimeout(() => {
          toStep.classList.add('fade-enter-active');
        }, 20);

        setTimeout(() => {
          toStep.classList.remove('fade-enter', 'fade-enter-active');
        }, 600);
      }, 350);
    }

    // Переход от Шага 1 к Шагу 2
    btnNext.addEventListener('click', () => {
      currentStep = 2;
      clicksRemaining = 10;
      clicksLeftEl.textContent = clicksRemaining;
      transitionSteps(step1, step2);
    });

    // Шаг 2: Клики по сердечку
    interactiveHeart.addEventListener('click', (e) => {
      if (clicksRemaining <= 0) return;

      clicksRemaining--;
      clicksLeftEl.textContent = clicksRemaining;

      // Эффект вибрации/потряхивания
      interactiveHeart.classList.remove('shake-heart');
      void interactiveHeart.offsetWidth; // перезапуск CSS анимации
      interactiveHeart.classList.add('shake-heart');

      // Создание микро-взрыва сердечек в точке клика
      const rect = interactiveHeart.getBoundingClientRect();
      const clickX = e.clientX || (rect.left + rect.width / 2);
      const clickY = e.clientY || (rect.top + rect.height / 2);
      createBurst(clickX, clickY, 8, true);

      // Когда кликнули 10 раз -> Взрыв и переход к Шагу 3 (Торт)
      if (clicksRemaining === 0) {
        // Большой праздничный взрыв сердечек
        createBurst(clickX, clickY, 60, true);
        createBurst(clickX, clickY, 40, false);

        setTimeout(() => {
          currentStep = 3;
          transitionSteps(step2, step3);
        }, 500);
      }
    });

    // Шаг 3: Нажатие на свечку / торт
    cakeContainer.addEventListener('click', (e) => {
      if (currentStep !== 3) return;

      // Задуваем свечу (плавно гасим огонек)
      candleFlame.style.transition = 'all 0.5s ease-out';
      candleFlame.style.opacity = '0';
      candleFlame.style.transform = 'scale(0.1) translateY(-20px)';

      // Взрыв искр и звезд около свечки
      const rect = cakeContainer.getBoundingClientRect();
      const flameX = rect.left + rect.width * 0.5;
      const flameY = rect.top + rect.height * 0.2;
      createBurst(flameX, flameY, 50, false);

      // Плавное превращение торта в финальное поздравление (Шаг 4)
      setTimeout(() => {
        currentStep = 4;
        transitionSteps(step3, step4);
        
        // Дополнительный салют из конфетти в честь поздравления
        setTimeout(() => {
          createBurst(width * 0.3, height * 0.4, 40, true);
          createBurst(width * 0.7, height * 0.4, 40, true);
        }, 300);
      }, 700);
    });

    // Шаг 4: Кнопка "Сначала" (Сброс всего состояния)
    btnRestart.addEventListener('click', () => {
      // Сброс свечи для следующего раза
      candleFlame.style.opacity = '1';
      candleFlame.style.transform = 'scale(1) translateY(0)';

      currentStep = 1;
      clicksRemaining = 10;
      clicksLeftEl.textContent = clicksRemaining;

      transitionSteps(step4, step1);
    });

  </script>
</body>
</html>
